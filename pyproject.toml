[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paypal-payment-service"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.146,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3", "itsdangerous>=2.2,<3", "pwdlib[argon2]>=0.2,<1", "tzdata>=2025",
]

[project.optional-dependencies]
dev = ["httpx2>=2,<3", "pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.per-file-target-version]
# Deployment helpers use Ubuntu's system Python, independently of the API image.
"deployment/**/*.py" = "py310"

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
files = ["backend/app"]
