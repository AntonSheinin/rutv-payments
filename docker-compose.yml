services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the selected env file}
    volumes: [payments-db:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U payments -d payments"]
      interval: 5s
      retries: 10
  api:
    # Built locally with --build; production deployment tags its pulled digest here.
    image: rutv-payments:production
    pull_policy: never
    build: .
    env_file: ${COMPOSE_ENV_FILES:?Select COMPOSE_ENV_FILES=.env.dev or .env.prod}
    ports: ["127.0.0.1:8100:8000"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 150s
volumes:
  payments-db:
