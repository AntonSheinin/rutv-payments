services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Select --env-file .env.dev or .env.prod}
    volumes: [payments-db:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U payments -d payments"]
      interval: 5s
      retries: 10
  api:
    # Built locally with --build; production deployment tags its pulled digest here.
    image: rutv-payments:production
    pull_policy: never
    build: .
    # Docker Compose resolves these from the explicitly selected --env-file.
    environment:
      - POSTGRES_PASSWORD
      - APP_SECRET
      - LOG_LEVEL
      - AUTH_USERS
      - API_KEYS
      - ALLOWED_IPS
      - COOKIE_SECURE
      - ALLOWED_ORIGINS
      - PAYPAL_ENVIRONMENT
      - PAYPAL_CLIENT_ID
      - PAYPAL_CLIENT_SECRET
      - PAYPAL_MERCHANT_ID
      - PAYPAL_RETURN_URL
      - PAYPAL_CANCEL_URL
      - MAXIMUM_AMOUNT
      - AUTO_BILL_OUTSTANDING
      - PAYMENT_FAILURE_THRESHOLD
      - FORWARDED_ALLOW_IPS
    ports: ["127.0.0.1:8100:8000"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 150s
volumes:
  payments-db:
