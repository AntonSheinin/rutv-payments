name: Checks
on:
  push:
  pull_request:
  workflow_call:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: payments_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U payments -d payments_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version-file: ".python-version"}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Install uv
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/0.13.1/install.sh -o /tmp/uv-install.sh
          sh /tmp/uv-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check backend && uv run --locked --extra dev ruff format --check backend && uv run --locked --extra dev mypy backend/app
      - run: npm ci && npm run build && npm run format:check
        working-directory: frontend
      - name: Check migrations on an empty database
        run: |
          uv run --locked --extra dev alembic upgrade head
          uv run --locked --extra dev alembic check
        env:
          # Alembic rejects overrides whose database name does not start with payments_test.
          TEST_DATABASE_URL: postgresql+psycopg://payments:local-development-only@127.0.0.1:54329/payments_test
      - run: uv run --locked --extra dev pytest -q
