name: Deploy production

# Deliberately manual: pushes, tags and successful checks never deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rutv-payments-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and publish the selected commit
        id: publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$image:sha-$GITHUB_SHA"
          docker build --pull --tag "$tag" .
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
          docker push "$tag"
          reference=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
          [[ "$reference" == "$image@sha256:"* ]]
          printf 'image=%s\n' "$reference" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Transfer release and deploy over verified SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/anton/paypal-payment-service' }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          IMAGE_REF: ${{ needs.publish.outputs.image }}
        shell: bash
        run: bash deployment/dispatch.sh
      - name: Record deployed image
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image }}
        run: printf 'Deployed %s to the production Compose project.\n' "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
